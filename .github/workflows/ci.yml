# Continuous integration (openspec/changes/bootstrap-rust-workspace/design.md,
# "Continuous integration"). `cargo xtask ci` runs the same checks locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (Rust 1.99 with rustfmt and clippy).
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version
      # cpal (ALSA) and gilrs (libudev) find the system libraries through
      # pkg-config when the desktop crate is built on Linux.
      - name: Install the ALSA and udev development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The full local sequence, which adds the dependency-direction check
      # (digger-core and digger-sound must not depend on platform crates).
      # The steps above are already built and cached, so this reruns quickly.
      - name: cargo xtask ci
        run: cargo xtask ci

  # The full replay conformance suite: all 50 upstream recordings, in an
  # optimised build (openspec/changes/add-recording-and-conformance/design.md,
  # D11; replay-verification spec, "Suite tiers and run time"). The quick
  # tier, codec, hash, malformed-input and isolation tests already run in
  # every `check` job through `cargo test --workspace`.
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Conformance tests (quick and full tier)
        run: cargo test --release -p digger-core --test conformance -- --include-ignored
      - name: Conformance report (full tier)
        # The `xtask` profile optimises the simulation (Cargo.toml).
        run: cargo xtask conformance --tier full
      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: target/conformance/report.md
          if-no-files-found: warn

  # The web build with its size budget and the browser smoke tests
  # (openspec/changes/add-web-build-and-releases/design.md, decision 12):
  # Chromium on pull requests and branch pushes, Chromium, Firefox and
  # WebKit on pushes to main.
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENGINES: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml, which lists wasm32-unknown-unknown.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      # The command-line tool must be the version of the library in
      # Cargo.lock; `cargo xtask web` refuses any other.
      - name: Read the pinned tool versions
        id: versions
        run: |
          bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          playwright=$(node -p 'require("./web/tests/package-lock.json").packages["node_modules/@playwright/test"].version')
          test -n "$bindgen" && test -n "$playwright"
          echo "wasm-bindgen=$bindgen" >> "$GITHUB_OUTPUT"
          echo "playwright=$playwright" >> "$GITHUB_OUTPUT"
      - name: Cache wasm-bindgen-cli
        id: bindgen-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ steps.versions.outputs.wasm-bindgen }}
      - name: Install wasm-bindgen-cli
        if: steps.bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install --locked wasm-bindgen-cli --version "${{ steps.versions.outputs.wasm-bindgen }}" --bin wasm-bindgen
      - name: Web build and size budget
        run: cargo xtask web
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/tests/package-lock.json
      - name: Install the test tools
        working-directory: web/tests
        run: npm ci
      - name: Cache the browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}-${{ env.ENGINES }}
      - name: Install the browsers
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: web/tests
        run: npx playwright install --with-deps $ENGINES
      - name: Install the browsers' system libraries
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: web/tests
        run: npx playwright install-deps $ENGINES
      - name: Browser smoke tests
        working-directory: web/tests
        run: |
          projects=()
          for engine in $ENGINES; do projects+=("--project=$engine"); done
          npx playwright test "${projects[@]}"
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/tests/test-results/
          if-no-files-found: ignore

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  openspec:
    name: openspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate OpenSpec changes and specs
        run: npx --yes @fission-ai/openspec validate --all --strict
