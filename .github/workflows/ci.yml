# Continuous integration (openspec/changes/bootstrap-rust-workspace/design.md,
# "Continuous integration"). `cargo xtask ci` runs the same checks locally.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (Rust 1.99 with rustfmt and clippy).
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Show the toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # The full local sequence, which adds the dependency-direction check
      # (digger-core and digger-sound must not depend on platform crates).
      # The steps above are already built and cached, so this reruns quickly.
      - name: cargo xtask ci
        run: cargo xtask ci

  deny:
    name: deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check
