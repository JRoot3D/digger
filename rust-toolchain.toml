[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
# The web build (add-web-build-and-releases, task 1.1). The two Apple targets of
# the macOS universal release build are added by that release job only, so
# Windows and Linux machines do not download them; every other platform builds
# for its host target.
targets = ["wasm32-unknown-unknown"]
