[workspace]
resolver = "3"
members = [
  "crates/digger-core",
  "crates/digger-sound",
  "crates/digger",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later"
repository = "https://github.com/JRoot3D/digger"
authors = ["The Digger Rust contributors"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
cpal = "0.18.2"
directories = "6.0.0"
gilrs = "0.11.2"
js-sys = "0.3.107"
md-5 = "0.11.0"
miniz_oxide = "0.9.1"
proptest = "1.12.0"
rtrb = "0.4.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.1"
softbuffer = "0.4.8"
toml = "1.2.1"
# The browser binding layer of the web build. `wasm-bindgen-cli` must be the
# exact version of `wasm-bindgen` in Cargo.lock (add-web-build-and-releases,
# design decision 2).
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
web-time = "1.1.0"
winit = "0.30.12"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed until public APIs exist (design.md, "Lints").
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Restriction lints: each use must be justified at its site with
# #[expect(..., reason = "...")].
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
# The heap types, methods and macros of clippy.toml are banned only in the
# simulation (crates/digger-core/src/sim/mod.rs denies these three lints);
# everywhere else they are allowed.
disallowed_types = "allow"
disallowed_methods = "allow"
disallowed_macros = "allow"

# The simulation is optimised in test builds, so that the quick conformance
# tier and the malformed-input tests (thousands of short playbacks) run in
# seconds; debug assertions and overflow checks stay on, as in any test
# build (design D11 of add-recording-and-conformance).
[profile.test.package.digger-core]
opt-level = 2

# `cargo xtask` builds into its own profile (target/xtask/), so that the
# `cargo test` run by `cargo xtask ci` never has to replace the running
# xtask executable, which Windows refuses ("Access is denied"). The
# simulation is optimised here too, so `cargo xtask conformance --tier
# full` runs the long recordings quickly; checks stay on, as in dev.
[profile.xtask]
inherits = "dev"

# The browser build (add-web-build-and-releases, design decision 2): small
# rather than fast code, whole-program optimisation, and no unwinding tables,
# to stay inside the size budget without `wasm-opt`. Used only with
# `--target wasm32-unknown-unknown`.
[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# Not `strip = true`: stripping symbols also removes the `target_features`
# custom section that `wasm-bindgen` reads to learn which Wasm features
# (reference types, multi-value) the module uses (task 1.2 finding,
# recorded in design.md, decision 2).
strip = "debuginfo"

[profile.xtask.package.digger-core]
opt-level = 2
