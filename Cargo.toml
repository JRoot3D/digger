[workspace]
resolver = "3"
members = [
  "crates/digger-core",
  "crates/digger-sound",
  "crates/digger",
  "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later"
repository = "https://github.com/JRoot3D/digger"
authors = ["The Digger Rust contributors"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
miniz_oxide = "0.9.1"
sha2 = "0.11.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed until public APIs exist (design.md, "Lints").
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
# Restriction lints: each use must be justified at its site with
# #[expect(..., reason = "...")].
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
# The heap types, methods and macros of clippy.toml are banned only in the
# simulation (crates/digger-core/src/sim/mod.rs denies these three lints);
# everywhere else they are allowed.
disallowed_types = "allow"
disallowed_methods = "allow"
disallowed_macros = "allow"
