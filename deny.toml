# cargo-deny configuration: `cargo deny check` runs in CI (design.md,
# "Continuous integration") and must pass on every commit.

[graph]
# Check the dependency graph of every platform the port ships on, so a crate
# pulled in only behind a `cfg(windows)` or `cfg(target_os = "macos")` table
# is still checked on a Linux host.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the check unless it is listed here with a reason.
ignore = [
  # ttf-parser is unmaintained (no vulnerability). It reaches the build only
  # through winit's default `wayland-csd-adwaita` feature (sctk-adwaita ->
  # ab_glyph), which draws the window title into the client-side frame on
  # Wayland compositors without server-side decorations. No maintained
  # release of that chain exists yet; revisit when sctk-adwaita moves to
  # another font parser (add-desktop-app, task 1.2).
  { id = "RUSTSEC-2026-0192", reason = "unmaintained, not a vulnerability; only used to draw the Wayland title bar text" },
]

[licenses]
# The workspace is GPL-2.0-or-later. Only licences that may be combined with
# it and distributed under the GPL are allowed, and only those some crate of
# the graph (all six targets above, browser-only crates included) actually
# needs: a crate offering several licences is taken under one of these, so
# most dual MIT/Apache-2.0 crates are taken under MIT. A licence missing
# here makes `cargo deny check` fail, in CI and in the release workflow's
# `verify` job (add-web-build-and-releases, design decision 15). Reviewed
# for the web build: every browser-only crate (wasm-bindgen and its macro
# crates, js-sys, web-sys, wasm-bindgen-futures, web-time, bumpalo,
# futures-*, pin-project) is MIT OR Apache-2.0, so it adds no licence.
allow = [
  # The workspace crates themselves (digger, digger-core, digger-sound,
  # xtask).
  "GPL-2.0-or-later",
  # Most dependencies; compatible with GPL version 2.
  "MIT",
  # Crates offered under Apache-2.0 only: winit and its dpi crate (in every
  # build, the web one included), cpal (every build), gethostname (x11rb,
  # Linux), ab_glyph, ab_glyph_rasterizer and owned_ttf_parser (the Wayland
  # title bar, Linux). Apache-2.0 is compatible with GPL version 3 but
  # not with version 2, so binaries containing these crates are conveyed
  # under the "or later" option of GPL-2.0-or-later, i.e. GPL version 3
  # (docs/releasing.md, "Licences").
  "Apache-2.0",
  # arrayref (tiny-skia, the Wayland title bar); compatible with GPL 2.
  "BSD-2-Clause",
  # tiny-skia and tiny-skia-path (the Wayland title bar); compatible with
  # GPL 2.
  "BSD-3-Clause",
  # inotify and inotify-sys (gilrs, Linux) and libloading (dlib, which
  # loads the Wayland and X11 libraries on Linux); ISC is
  # equivalent to the MIT terms.
  "ISC",
  # option-ext (directories, native builds): MPL-2.0 lists the GNU GPL
  # version 2 or later as a Secondary Licence, so it may be combined with
  # the workspace.
  "MPL-2.0",
  # unicode-ident's Unicode data tables ("(MIT OR Apache-2.0) AND
  # Unicode-3.0"; a proc-macro dependency, not linked into the binaries);
  # a permissive notice licence.
  "Unicode-3.0",
]
confidence-threshold = 0.9
# An entry no crate needs any more is reported, so the list stays the set
# of licences actually in use; it is a warning so that a dependency update
# that drops a crate does not block a release.
unused-allowed-license = "warn"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# "No C" (CLAUDE.md, docs/porting-plan.md): no SDL bindings and no build-time
# C compilation or binding generation anywhere in the workspace.
deny = [
  { crate = "sdl2", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "sdl3", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "sdl2-sys", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "sdl3-sys", reason = "no SDL: the port uses Rust-only platform crates" },
  # The one crate allowed to depend on `cc` is `wayland-backend` (through
  # winit and softbuffer on Linux), whose build script compiles C only with
  # its `log` feature; `[[bans.features]]` below denies that feature, so the
  # build script never calls `cc` (add-desktop-app, task 1.2).
  { crate = "cc", wrappers = ["wayland-backend"], reason = "no C: nothing may be compiled from C at build time" },
  { crate = "bindgen", reason = "no C: no bindings to C headers" },
]

# `wayland-backend`'s `log` feature compiles two C shims with `cc`; it must
# stay off (see the `cc` ban above).
[[bans.features]]
crate = "wayland-backend"
deny = ["log"]
reason = "no C: the log feature compiles C shims at build time"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
