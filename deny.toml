# cargo-deny configuration: `cargo deny check` runs in CI (design.md,
# "Continuous integration") and must pass on every commit.

[graph]
# Check the dependency graph of every platform the port ships on, so a crate
# pulled in only behind a `cfg(windows)` or `cfg(target_os = "macos")` table
# is still checked on a Linux host.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the check unless it is listed here with a reason.
ignore = []

[licenses]
# The workspace is GPL-2.0-or-later. Only licences that may be combined with
# it and distributed under the GPL are allowed. Apache-2.0 and MPL-2.0 are
# compatible with GPL version 3, which "or later" permits; in practice the
# Rust ecosystem offers them dual-licensed with MIT.
allow = [
  "GPL-2.0-or-later",
  "GPL-2.0",
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Unlicense",
  "MPL-2.0",
]
confidence-threshold = 0.9
# The allow-list anticipates the platform crates later changes add.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
# "No C" (CLAUDE.md, docs/porting-plan.md): no SDL bindings and no build-time
# C compilation or binding generation anywhere in the workspace.
deny = [
  { crate = "sdl2", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "sdl3", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "sdl2-sys", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "sdl3-sys", reason = "no SDL: the port uses Rust-only platform crates" },
  { crate = "cc", reason = "no C: nothing may be compiled from C at build time" },
  { crate = "bindgen", reason = "no C: no bindings to C headers" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
