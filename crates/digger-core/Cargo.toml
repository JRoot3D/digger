[package]
name = "digger-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Deterministic Digger simulation: game state, framebuffer rendering and recordings, with no I/O."
publish = false

[features]
# Scenario builder, input scripts and validated entity setters for tests
# (design D11). Off in normal builds.
testkit = []

[dependencies]
miniz_oxide.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The scenario tests under tests/ and the test kit's doc example use the
# test kit, so test builds enable it for this crate itself.
digger-core = { path = ".", features = ["testkit"] }
