[package]
name = "digger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Digger Remastered re-created in Rust: the desktop game."
publish = false

[[bin]]
name = "digger"
path = "src/main.rs"

[dependencies]
cpal.workspace = true
digger-core = { path = "../digger-core" }
digger-sound = { path = "../digger-sound" }
gilrs.workspace = true
serde.workspace = true
softbuffer.workspace = true
toml.workspace = true
winit.workspace = true

# The command line and the per-user directories exist only on the desktop
# (add-web-build-and-releases, design decision 4).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap.workspace = true
directories.workspace = true

# The browser bindings of the web build (design decisions 3 and 8), and
# cpal's Web Audio host. The `web-sys` features are what the web code uses.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
  "Blob",
  "BlobPropertyBag",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "HtmlAnchorElement",
  "HtmlCanvasElement",
  "HtmlElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "Location",
  "MediaQueryList",
  "Node",
  "Storage",
  "Url",
  "Window",
  "console",
] }
web-time.workspace = true

[dev-dependencies]
# The end-to-end input tests drive scenario games (task 5.5).
digger-core = { path = "../digger-core", features = ["testkit"] }

[lints]
workspace = true
