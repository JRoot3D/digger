[package]
name = "digger"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Digger Remastered re-created in Rust: the desktop game."
publish = false

[[bin]]
name = "digger"
path = "src/main.rs"

[dependencies]
clap.workspace = true
cpal.workspace = true
digger-core = { path = "../digger-core" }
digger-sound = { path = "../digger-sound" }
directories.workspace = true
gilrs.workspace = true
serde.workspace = true
softbuffer.workspace = true
toml.workspace = true
winit.workspace = true

[dev-dependencies]
# The end-to-end input tests drive scenario games (task 5.5).
digger-core = { path = "../digger-core", features = ["testkit"] }

[lints]
workspace = true
